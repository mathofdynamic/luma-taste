<!doctype html><html class="keep-me dark"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Correct fixture</title><style>html{font-family:Arial}body{margin:0;padding:20px;font-size:16px;background:#fafafa;color:#161616}html.dark body{background:#101015;color:#fafafa}.lm-gradient-word{display:inline-block;background:linear-gradient(90deg,#a66acc,#e06aa2,#e1a365,#e06aa2,#a66acc);background-size:200% 100%;color:transparent;background-clip:text;animation:flow 6s linear infinite;animation-play-state:paused}[data-loop][data-in-view=true]{animation-play-state:running}@keyframes flow{to{background-position:200% center}}.marquee{overflow:hidden;width:280px;margin-top:20px}.track{display:flex;width:max-content;animation:travel 60s linear infinite;animation-play-state:paused}.set{width:300px;box-sizing:border-box;display:flex;gap:16px;padding-right:16px}.set span{width:134px;flex-shrink:0;display:block;background:#666;color:white;padding:16px;box-sizing:border-box}@keyframes travel{to{transform:translateX(-50%)}}.lm-motion [data-reveal][data-revealed=false]{opacity:0;transform:translate3d(0,24px,0)}.lm-motion [data-reveal][data-revealed=true]{opacity:1;transform:none;transition:opacity 600ms cubic-bezier(.16,1,.3,1),transform 600ms cubic-bezier(.16,1,.3,1)}.spacer{height:1400px}@media(prefers-reduced-motion:reduce){*{animation:none!important}.lm-motion [data-reveal]{opacity:1!important;transform:none!important;transition:none!important}}.fill{position:relative;isolation:isolate;overflow:hidden;padding:10px 20px;border-radius:999px}.fill::before{content:"";position:absolute;z-index:-1;inset-inline:-25%;inset-block-start:100%;block-size:260%;border-radius:50%;background:#ccc}</style><body><h1><span data-loop class="lm-gradient-word">Luma</span></h1><button class="fill" type="button">Liquid fill button</button><div class="marquee"><div data-loop class="track"><div class="set"><span>First</span><span>Second</span></div><div class="set" aria-hidden="true" inert><span>First</span><span>Second</span></div></div></div><div class="spacer"></div><p data-reveal>Revealed when it scrolls into view</p><script>const io=new IntersectionObserver(es=>es.forEach(e=>e.target.dataset.inView=String(e.isIntersecting)),{rootMargin:'0px'});document.querySelectorAll('[data-loop]').forEach(e=>io.observe(e));if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const r=document.querySelectorAll('[data-reveal]');r.forEach(e=>{const b=e.getBoundingClientRect();e.dataset.revealed=String(b.top<innerHeight&&b.bottom>0)});document.documentElement.classList.add('lm-motion');const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.dataset.revealed='true';ro.unobserve(e.target)}}),{threshold:.15,rootMargin:'0px 0px -10% 0px'});r.forEach(e=>e.dataset.revealed==='false'&&ro.observe(e));addEventListener('scroll',()=>{if(innerHeight+scrollY<document.documentElement.scrollHeight-2)return;r.forEach(e=>{if(e.dataset.revealed==='false'&&e.getBoundingClientRect().top<innerHeight){e.dataset.revealed='true';ro.unobserve(e)}})},{passive:true})}</script></body></html>
