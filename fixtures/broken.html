<!doctype html><html><meta charset="utf-8"><link rel="icon" href="data:,"><title>Broken fixture</title><style>body{background:white;color:black;font-size:16px}.wide{width:200vw}.clip{width:25px;height:18px;overflow:hidden}.ellipsis{width:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fa{letter-spacing:2px}.hidden{opacity:0}.loop{margin-top:1200px;width:30px;height:30px;animation:bad 2s infinite}.fast{transition:opacity 100ms}@keyframes bad{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loop{animation:none}}</style><body><h1>Broken</h1><p class="wide">Overflow</p><p class="clip">Clipped paragraph contains multiple lines</p><p class="ellipsis">Ellipsized text deliberately</p><p class="fa">سلام دنیا</p><p data-reveal class="hidden">Hidden without JavaScript</p><div class="loop"></div><p data-reveal>Below the fold but visible at load</p><p data-reveal data-revealed="true" class="fast">Revealed in 100ms</p><script>document.querySelector(".fast").animate([{opacity:0,transform:"translateY(20px)"},{opacity:1,transform:"none"}],{duration:100})</script></body></html>
